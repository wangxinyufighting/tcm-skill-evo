[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tcmskill"
version = "0.1.0"
description = "Self-evolving prescribing-skill memory for TCM herb prescription agents"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "pyyaml>=6.0", "matplotlib>=3.7"]

[project.optional-dependencies]
api = ["openai>=1.40", "json_repair>=0.25"]
test = ["pytest>=7"]
sdpr = ["torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
